name: Log Page Views

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push files back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch traffic data from GitHub API
      run: |
        mkdir -p stats
        
        # This dynamic URL handles the exact endpoints for your repo automatically
        curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/vnd.github.v3+json" \
             -H "User-Agent: github-actions-view-counter" \
             "https://github.com/{{ github.repository }}/traffic/views" \
             > stats/views_latest.json

        # Ensure history log file exists
        if [ ! -f stats/history_log.json ]; then
          echo "[]" > stats/history_log.json
        fi

        # Append timestamped entries to keep data beyond the standard 14 days
        echo "{\"date\":\"$(date -u +%Y-%m-%d)\",\"data\":$(cat stats/views_latest.json)}" >> stats/history_log.json

    - name: Commit and push tracking logs
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add stats/
        
        # Safely commit and handle instances where data is identical to previous run
        git commit -m "chore: update traffic logs" || echo "No changes to commit"
        git push
