name: Log Page Views

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch traffic data
        env:
          GHTOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p stats
          
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GHTOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/traffic/views" \
            -o stats/views_latest.json
            
          jq -e '.views | type == "array"' stats/views_latest.json > /dev/null
          
          if [ ! -f stats/history_log.json ]; then
            echo "[]" > stats/history_log.json
          fi
          
          jq -e 'type == "array"' stats/history_log.json > /dev/null
          
          jq --arg date "$(date -u +%Y-%m-%d)" \
             --slurpfile latest stats/views_latest.json \
             '. + [{"date": $date, "data": $latest[0]}]' \
             stats/history_log.json > stats/history_log.tmp
             
          mv stats/history_log.tmp stats/history_log.json

      - name: Commit and push tracking logs
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add stats/views_latest.json stats/history_log.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update traffic logs"
          git push
