```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My LinkedIn Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
        }

        header {
            height: 70px;
            background: #0a66c2;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 25px auto;
        }

        .profile-header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-header h2 {
            margin: 0 0 10px;
        }

        .profile-header a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: bold;
        }

        .linkedin-frame {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 10px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .fallback {
            margin-top: 15px;
            text-align: center;
        }

        .fallback a {
            display: inline-block;
            background: #0a66c2;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>My LinkedIn Profile</h1>
</header>

<div class="container">

    <div class="profile-header">
        <h2>Srinivas Malla</h2>

        <a
            href="https://www.linkedin.com/in/balaji-mohan-a221691b/"
            target="_blank">
            Open LinkedIn Profile
        </a>
    </div>

    <iframe
        class="linkedin-frame"
        src="https://www.linkedin.com/in/balaji-mohan-a221691b/"
        title="LinkedIn Profile">
    </iframe>

    <div class="fallback">
        <p>
            If LinkedIn does not allow the profile to load inside the frame,
            open it directly:
        </p>

        <a
            href="https://www.linkedin.com/in/balaji-mohan-a221691b/"
            target="_blank">
            Open LinkedIn
        </a>
    </div>

</div>

</body>
</html>
```
